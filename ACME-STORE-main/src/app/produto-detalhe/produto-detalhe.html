<div class="container-fluid d-flex justify-content-center align-items-center vh-100 bg-dark p-2 overflow-hidden">

    @if (produto; as prod) {
    <div class="card border-0 shadow-lg text-white overflow-hidden position-relative w-100"
        style="max-width: 390px; height: 90vh; background-color: #1a1918; border-radius: 14px;">

        <!-- Botão Fechar -->
        <a routerLink="/"
            class="position-absolute top-0 start-0 m-3 z-3 btn btn-dark rounded-circle p-2 d-flex align-items-center justify-content-center shadow border border-secondary border-opacity-50"
            style="width: 36px; height: 36px; text-decoration: none;">
            ✕
        </a>

        <!-- Categoria -->
        <span class="position-absolute top-0 end-0 m-3 z-3 badge text-uppercase fw-bold px-2 py-1 shadow"
            style="background-color: #d97706; font-size: 10px;">
            {{ prod.categoria }}
        </span>

        <!-- Imagem de Destaque -->
        <div class="w-100 position-relative bg-black d-flex align-items-center justify-content-center overflow-hidden"
            style="height: 52%;">
            <img [src]="prod.imagem" [alt]="prod.alt" class="w-100 h-100 object-fit-cover"
                style="filter: brightness(0.95);">
            <div class="position-absolute bottom-0 w-100 h-25"
                style="background: linear-gradient(to top, #1a1918, transparent);"></div>
        </div>

        <!-- Informações Dinâmicas -->
        <div class="card-body d-flex flex-column justify-content-between p-3" style="height: 48%;">
            <div>
                <div class="d-flex justify-content-between align-items-baseline mb-1">
                    <small class="text-warning fw-bold text-uppercase" style="letter-spacing: 0.1em; font-size: 9px;">{{
                        prod.codigo }}</small>
                    <small class="text-muted" style="font-size: 9px;">Risco: {{ prod.perigo }}/5 🧨</small>
                </div>

                <h3 class="fw-bold mb-1 text-uppercase text-truncate" style="font-size: 18px; letter-spacing: -0.5px;">
                    {{ prod.nome }}</h3>

                <p class="text-light fst-italic small mb-2"
                    style="color: #d6d3d1 !important; font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-hidden;">
                    "{{ prod.slogan }}"
                </p>

                <div class="d-flex gap-2 mb-1">
                    <span class="badge bg-secondary bg-opacity-25 text-light border border-secondary border-opacity-50"
                        style="font-size: 8px;">Peso: {{ prod.peso }}</span>
                </div>
            </div>

            <!-- Preço e CTA -->
            <div
                class="pt-2 border-top border-secondary border-opacity-25 d-flex align-items-center justify-content-between mt-auto">
                <div>
                    <small class="text-muted d-block text-uppercase" style="font-size: 8px;">Preço</small>
                    <span class="fs-5 fw-bold text-warning">R$ {{ prod.preco.toFixed(2) }}</span>
                </div>

                <button (click)="adicionarACesta(prod)" class="btn text-uppercase fw-bold px-3 py-2 shadow"
                    style="background-color: #d97706; color: #fff; font-size: 10px; border-radius: 6px;">
                    🛒 comprar
                </button>
            </div>

        </div>

    </div>
    } @else {
    <div class="text-white text-center">
        <p class="mb-0">Carregando produto...</p>
    </div>
    }

</div>
